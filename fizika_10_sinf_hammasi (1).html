&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;header&gt;&lt;h1&gt;10-sinf fizika&lt;/h1&gt;&lt;div&gt;1–4-mavzular uchun interaktiv simulyatsiya, animatsiya va laboratoriya ishlari&lt;/div&gt;&lt;/header&gt;&lt;main&gt;
&lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;active&quot; data-tab=&quot;t1&quot;&gt;1. Tadqiqot metodlari&lt;/button&gt;&lt;button data-tab=&quot;t2&quot;&gt;2. Harakat turlari&lt;/button&gt;&lt;button data-tab=&quot;t3&quot;&gt;3. Vertikal harakat&lt;/button&gt;&lt;button data-tab=&quot;t4&quot;&gt;4. Aylanma harakat&lt;/button&gt;&lt;/div&gt;
&lt;section id=&quot;t1&quot; class=&quot;panel active&quot;&gt;&lt;h2&gt;1-mavzu. Fizikaning tadqiqot metodlari&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;h3&gt;Simulyatsiya: tajriba va o‘lchash&lt;/h3&gt;&lt;canvas id=&quot;c1&quot; width=&quot;700&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Mayatnik uzunligi (m) &lt;input id=&quot;len&quot; type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;1&quot; step=&quot;0.1&quot; value=&quot;0.6&quot;&gt;&lt;span id=&quot;lenv&quot;&gt;0.6&lt;/span&gt;&lt;/label&gt;&lt;button id=&quot;swing&quot;&gt;Tebranishni boshlash&lt;/button&gt;&lt;button id=&quot;reset1&quot;&gt;Qayta boshlash&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card small&quot;&gt;Kuzatish: uzunlik o‘zgarganda tebranish davri qanday o‘zgaradi? Modelda &lt;b&gt;T ≈ 2π√(L/g)&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Fizik kuzatish va tajriba.&lt;/li&gt;&lt;li&gt;O‘lchash, taqqoslash va natijalarni qayd etish.&lt;/li&gt;&lt;li&gt;Fizik model, xatolik va xulosa.&lt;/li&gt;&lt;/ol&gt;&lt;h3&gt;Animatsiya&lt;/h3&gt;&lt;p class=&quot;small&quot;&gt;Mayatnik chapga va o‘ngga tebranadi; uzunlik slayderi o‘zgartirilganda tebranish tezligi ham o‘zgaradi.&lt;/p&gt;&lt;h3 class=&quot;lab&quot;&gt;Laboratoriya ishi: mayatnik davrini aniqlash&lt;/h3&gt;&lt;ol class=&quot;small lab&quot;&gt;&lt;li&gt;Mayatnik uzunligini o‘lchang.&lt;/li&gt;&lt;li&gt;10 ta tebranish vaqtini sekundomer bilan o‘lchang.&lt;/li&gt;&lt;li&gt;&lt;b&gt;T = t/N&lt;/b&gt; orqali davrni hisoblang.&lt;/li&gt;&lt;li&gt;Turli uzunliklarda natijalarni taqqoslab xulosa chiqaring.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;t2&quot; class=&quot;panel&quot;&gt;&lt;h2&gt;2-mavzu. Mexanik harakat turlari. Harakatlarning mustaqillik prinsipi&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;h3&gt;Simulyatsiya: gorizontal va vertikal harakat&lt;/h3&gt;&lt;canvas id=&quot;c2&quot; width=&quot;700&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Gorizontal tezlik (m/s) &lt;input id=&quot;vx&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;12&quot; value=&quot;7&quot;&gt;&lt;span id=&quot;vxv&quot;&gt;7&lt;/span&gt;&lt;/label&gt;&lt;label&gt;Gravitatsiya (m/s²) &lt;input id=&quot;g2&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;15&quot; value=&quot;9.8&quot; step=&quot;0.2&quot;&gt;&lt;span id=&quot;g2v&quot;&gt;9.8&lt;/span&gt;&lt;/label&gt;&lt;button id=&quot;run2&quot;&gt;Boshlash / pauza&lt;/button&gt;&lt;button id=&quot;reset2&quot;&gt;Qayta boshlash&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card small&quot;&gt;Gorizontal harakat tekis, vertikal harakat esa tezlanishli. Ular bir-biriga mustaqil sodir bo‘ladi.&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Mexanik harakat va sanoq sistemasi.&lt;/li&gt;&lt;li&gt;Tekis, tekis tezlanuvchan va egri chiziqli harakat.&lt;/li&gt;&lt;li&gt;Harakatlarning mustaqillik prinsipi.&lt;/li&gt;&lt;/ol&gt;&lt;h3&gt;Animatsiya&lt;/h3&gt;&lt;p class=&quot;small&quot;&gt;Jism gorizontal yo‘nalishda uchadi va bir vaqtda pastga tushadi. Nuqtali iz trayektoriyani ko‘rsatadi.&lt;/p&gt;&lt;h3&gt;Laboratoriya ishi: trayektoriyani o‘rganish&lt;/h3&gt;&lt;ol class=&quot;small lab&quot;&gt;&lt;li&gt;Jismning boshlang‘ich gorizontal tezligini o‘zgartiring.&lt;/li&gt;&lt;li&gt;Uchish masofasini taqqoslang.&lt;/li&gt;&lt;li&gt;Gravitatsiya qiymatini o‘zgartirib, vertikal harakatga ta’sirini kuzating.&lt;/li&gt;&lt;li&gt;Gorizontal va vertikal harakatlar haqida xulosa yozing.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;t3&quot; class=&quot;panel&quot;&gt;&lt;h2&gt;3-mavzu. Jismlarning vertikal harakati&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;h3&gt;Simulyatsiya: yuqoriga otilgan jism&lt;/h3&gt;&lt;canvas id=&quot;c3&quot; width=&quot;700&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Boshlang‘ich tezlik (m/s) &lt;input id=&quot;u3&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;25&quot; value=&quot;15&quot;&gt;&lt;span id=&quot;u3v&quot;&gt;15&lt;/span&gt;&lt;/label&gt;&lt;label&gt;g (m/s²) &lt;input id=&quot;g3&quot; type=&quot;range&quot; min=&quot;3&quot; max=&quot;15&quot; step=&quot;0.5&quot; value=&quot;9.8&quot;&gt;&lt;span id=&quot;g3v&quot;&gt;9.8&lt;/span&gt;&lt;/label&gt;&lt;button id=&quot;run3&quot;&gt;Boshlash / pauza&lt;/button&gt;&lt;button id=&quot;reset3&quot;&gt;Qayta boshlash&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;formula&quot;&gt;v = v₀ − gt; &amp;nbsp; h = v₀t − gt²/2&lt;/div&gt;&lt;div id=&quot;read3&quot; class=&quot;small&quot;&gt;Tezlik va balandlik qiymatlari shu yerda ko‘rsatiladi.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Erkin tushish va erkin tushish tezlanishi.&lt;/li&gt;&lt;li&gt;Vertikal yuqoriga otilgan jismning tezligi va balandligi.&lt;/li&gt;&lt;li&gt;Eng yuqori nuqta va tushish vaqti.&lt;/li&gt;&lt;/ol&gt;&lt;h3&gt;Animatsiya&lt;/h3&gt;&lt;p class=&quot;small&quot;&gt;Jism yuqoriga ko‘tarilib sekinlashadi, eng yuqori nuqtada bir lahza tezligi nolga teng bo‘ladi, so‘ng pastga tushadi.&lt;/p&gt;&lt;h3&gt;Laboratoriya ishi: vertikal harakatni tekshirish&lt;/h3&gt;&lt;ol class=&quot;small lab&quot;&gt;&lt;li&gt;Boshlang‘ich tezlikni tanlang.&lt;/li&gt;&lt;li&gt;Jismning eng yuqori balandligi va ko‘tarilish vaqtini kuzating.&lt;/li&gt;&lt;li&gt;Hisoblang: &lt;b&gt;tₘₐₓ = v₀/g&lt;/b&gt;, &lt;b&gt;hₘₐₓ = v₀²/(2g)&lt;/b&gt;.&lt;/li&gt;&lt;li&gt;Simulyatsiya natijalarini hisoblash bilan taqqoslang.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;t4&quot; class=&quot;panel&quot;&gt;&lt;h2&gt;4-mavzu. Aylana bo‘ylab notekis harakat. Burchak va tangensial tezlanish&lt;/h2&gt;&lt;div class=&quot;cols&quot;&gt;&lt;div&gt;&lt;h3&gt;Simulyatsiya: tezligi o‘zgaruvchi aylana harakati&lt;/h3&gt;&lt;canvas id=&quot;c4&quot; width=&quot;700&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Burchak tezlanish (rad/s²) &lt;input id=&quot;alpha4&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot; value=&quot;0.8&quot;&gt;&lt;span id=&quot;alpha4v&quot;&gt;0.8&lt;/span&gt;&lt;/label&gt;&lt;label&gt;Radius (m) &lt;input id=&quot;r4&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;4&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;span id=&quot;r4v&quot;&gt;2&lt;/span&gt;&lt;/label&gt;&lt;button id=&quot;run4&quot;&gt;Boshlash / pauza&lt;/button&gt;&lt;button id=&quot;reset4&quot;&gt;Qayta boshlash&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;formula&quot;&gt;ε = Δω/Δt; &amp;nbsp; aₜ = εr&lt;/div&gt;&lt;div id=&quot;read4&quot; class=&quot;small&quot;&gt;Burchak tezlik va tangensial tezlanish qiymatlari.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Aylana bo‘ylab notekis harakat.&lt;/li&gt;&lt;li&gt;Burchak tezlanish va burchak tezlik.&lt;/li&gt;&lt;li&gt;Tangensial tezlanish va chiziqli tezlik orasidagi bog‘lanish.&lt;/li&gt;&lt;/ol&gt;&lt;h3&gt;Animatsiya&lt;/h3&gt;&lt;p class=&quot;small&quot;&gt;Nuqta aylana bo‘ylab harakatlanadi va burchak tezligi asta-sekin ortadi. Radius va burchak tezlanish o‘zgartirilganda tangensial tezlanish qiymati yangilanadi.&lt;/p&gt;&lt;h3&gt;Laboratoriya ishi: aylanuvchi jismni kuzatish&lt;/h3&gt;&lt;ol class=&quot;small lab&quot;&gt;&lt;li&gt;Radiusni tanlang va harakatni boshlang.&lt;/li&gt;&lt;li&gt;Turli vaqt oralig‘ida burchak tezligining o‘zgarishini kuzating.&lt;/li&gt;&lt;li&gt;&lt;b&gt;aₜ = εr&lt;/b&gt; formula orqali tangensial tezlanishni hisoblang.&lt;/li&gt;&lt;li&gt;Radius ortishi tangensial tezlanishga qanday ta’sir qilishini izohlang.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;div class=&quot;card small&quot;&gt;&lt;b&gt;O‘qituvchi uchun:&lt;/b&gt; ushbu faylni telefon yoki kompyuterda brauzer orqali oching. Slayderlarni o‘zgartirib, animatsiyalarni ishga tushiring. Bu o‘quv modeli bo‘lib, real laboratoriya o‘lchovlari bilan taqqoslash tavsiya etiladi.&lt;/div&gt;&lt;/main&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya: kuch ta’siridagi aravacha&lt;/h3&gt;&lt;canvas id=&quot;c1&quot; width=&quot;900&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Kuch F: &lt;input id=&quot;f1&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;12&quot;&gt;&lt;output id=&quot;of1&quot;&gt;12 N&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Massa m: &lt;input id=&quot;m1&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;om1&quot;&gt;3 kg&lt;/output&gt;&lt;/label&gt;
&lt;button class=&quot;btn primary&quot; id=&quot;reset1&quot;&gt;Qayta boshlash&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;read1&quot; class=&quot;muted&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Kuchni oshirsangiz tezlanish ortadi; massani oshirsangiz, bir xil kuchda tezlanish kamayadi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Animatsiya: Nyutonning uchinchi qonuni&lt;/h3&gt;&lt;canvas id=&quot;third&quot; width=&quot;900&quot; height=&quot;220&quot;&gt;&lt;/canvas&gt;&lt;p class=&quot;muted&quot;&gt;Ikki jism o‘zaro ta’sirlashganda, ta’sir kuchlari kattaligi teng va yo‘nalishi qarama-qarshi bo‘ladi.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;t2&quot; class=&quot;panel&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;2. Galileyning nisbiylik prinsipi&lt;/h2&gt;&lt;p&gt;Mexanika qonunlari barcha inersial sanoq sistemalarida bir xil ko‘rinishda bajariladi. Harakat kuzatuvchi tanlagan sanoq sistemasiga nisbatan tavsiflanadi.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;v&lt;sub&gt;jism/yer&lt;/sub&gt; = v&lt;sub&gt;jism/poyezd&lt;/sub&gt; + v&lt;sub&gt;poyezd/yer&lt;/sub&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya: poyezd va yo‘lovchi&lt;/h3&gt;&lt;canvas id=&quot;c2&quot; width=&quot;900&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Poyezd tezligi: &lt;input id=&quot;trainV&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;25&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;otrainV&quot;&gt;10 m/s&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Yo‘lovchi tezligi (poyezdga nisbatan): &lt;input id=&quot;personV&quot; type=&quot;range&quot; min=&quot;-5&quot; max=&quot;5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;opersonV&quot;&gt;2 m/s&lt;/output&gt;&lt;/label&gt;
&lt;button class=&quot;btn primary&quot; id=&quot;toggle2&quot;&gt;Pauza&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;read2&quot; class=&quot;muted&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Yo‘lovchi poyezd harakati yo‘nalishida yursa, yerga nisbatan tezliklar qo‘shiladi; teskari yursa, ayiriladi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Inersial va noinertsial sistemalar&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Inersial sistema:&lt;/b&gt; jismga natijaviy kuch nol bo‘lsa, u tinch qoladi yoki tekis to‘g‘ri chiziqli harakat qiladi.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Noinertsial sistema:&lt;/b&gt; tezlanish bilan harakatlanayotgan sistema; unda soxta (inersiya) kuchlarini hisobga olish talab qilinishi mumkin.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;t3&quot; class=&quot;panel&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;3. Gravitatsion maydonda harakat&lt;/h2&gt;&lt;p&gt;Havo qarshiligi e’tiborga olinmasa, Yer yaqinida erkin tushish tezlanishi taxminan 9,8 m/s² ga teng.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;v = v₀ + gt &amp;nbsp; | &amp;nbsp; h = h₀ + v₀t − gt²/2&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya: jismning erkin tushishi&lt;/h3&gt;&lt;canvas id=&quot;c3&quot; width=&quot;900&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Boshlang‘ich balandlik: &lt;input id=&quot;height3&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;100&quot; value=&quot;80&quot;&gt;&lt;output id=&quot;oheight3&quot;&gt;80 m&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;g: &lt;input id=&quot;g3&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;15&quot; value=&quot;9.8&quot; step=&quot;0.1&quot;&gt;&lt;output id=&quot;og3&quot;&gt;9.8 m/s²&lt;/output&gt;&lt;/label&gt;
&lt;button class=&quot;btn primary&quot; id=&quot;drop3&quot;&gt;Tushirish&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;read3&quot; class=&quot;muted&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;note&quot;&gt;Modelda havo qarshiligi hisobga olinmaydi. “Tushirish” tugmasi jismni qayta harakatga keltiradi.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;t4&quot; class=&quot;panel&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;4. Jism og‘irligining harakat turiga bog‘liqligi&lt;/h2&gt;&lt;p&gt;Jismning tayanchga yoki osmaga ko‘rsatadigan kuchi — og‘irlik. Tinch holat yoki tekis harakatda u odatda mg ga teng; tezlanish bo‘lsa, ko‘rinma og‘irlik o‘zgaradi.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;Yuqoriga tezlanish: N = m(g + a) &amp;nbsp; | &amp;nbsp; Pastga: N = m(g − a)&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya: lift ichidagi tarozi&lt;/h3&gt;&lt;canvas id=&quot;c4&quot; width=&quot;900&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Massa m: &lt;input id=&quot;mass4&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;100&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;omass4&quot;&gt;60 kg&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Lift tezlanishi a: &lt;input id=&quot;acc4&quot; type=&quot;range&quot; min=&quot;-8&quot; max=&quot;8&quot; value=&quot;0&quot; step=&quot;0.5&quot;&gt;&lt;output id=&quot;oacc4&quot;&gt;0 m/s²&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p id=&quot;read4&quot; class=&quot;muted&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Musbat tezlanish yuqoriga, manfiy tezlanish pastga yo‘nalgan deb olinadi. Agar lift pastga erkin tushsa (a = −g), tarozi ko‘rsatkichi nolga yaqinlashadi.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;t5&quot; class=&quot;panel&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;5. Jismning bir necha kuch ta’siridagi harakati&lt;/h2&gt;&lt;p&gt;Jismning tezlanishi barcha kuchlarning vektor yig‘indisi orqali aniqlanadi.&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;F&lt;sub&gt;nat&lt;/sub&gt; = ΣF &amp;nbsp; | &amp;nbsp; a = F&lt;sub&gt;nat&lt;/sub&gt;/m&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya: qarama-qarshi kuchlar&lt;/h3&gt;&lt;canvas id=&quot;c5&quot; width=&quot;900&quot; height=&quot;300&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;O‘ngga kuch F₁: &lt;input id=&quot;f51&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;25&quot;&gt;&lt;output id=&quot;of51&quot;&gt;25 N&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Chapga kuch F₂: &lt;input id=&quot;f52&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; value=&quot;10&quot;&gt;&lt;output id=&quot;of52&quot;&gt;10 N&lt;/output&gt;&lt;/label&gt;
&lt;label&gt;Massa: &lt;input id=&quot;m5&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;om5&quot;&gt;5 kg&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p id=&quot;read5&quot; class=&quot;muted&quot;&gt;&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Natijaviy kuch nol bo‘lsa, tezlanish nol: jism tinch turishi yoki o‘zgarmas tezlikda harakatlanishi mumkin.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Mustahkamlash savollari&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Natijaviy kuch ikki marta oshsa, massa o‘zgarmaganda tezlanish qanday o‘zgaradi?&lt;/li&gt;&lt;li&gt;Poyezdga nisbatan 2 m/s tezlikda oldinga yurgan yo‘lovchining yerga nisbatan tezligi qanday topiladi?&lt;/li&gt;&lt;li&gt;Erkin tushishda tezlik vaqt o‘tishi bilan qanday o‘zgaradi?&lt;/li&gt;&lt;li&gt;Lift yuqoriga tezlanayotganda tarozi ko‘rsatkichi nima sababdan ortadi?&lt;/li&gt;&lt;li&gt;Jismga 20 N o‘ngga va 20 N chapga kuch ta’sir etsa, natijaviy kuch qancha?&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;/main&gt;
&lt;footer&gt;10-sinf fizika • II bob: Dinamika • Interaktiv o‘quv materiali&lt;/footer&gt;
&lt;script&gt;
const $=id=&gt;document.getElementById(id);
document.querySelectorAll(&#x27;nav button&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{document.querySelectorAll(&#x27;nav button&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));b.classList.add(&#x27;active&#x27;);$(b.dataset.tab).classList.add(&#x27;active&#x27;)}));
function ctx(id){let c=$(id),x=c.getContext(&#x27;2d&#x27;);return {c,x,w:c.width,h:c.height}}
function line(x,a,b,c,d,color=&#x27;#7d8da5&#x27;,width=2){x.strokeStyle=color;x.lineWidth=width;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}
function text(x,s,a,b,color=&#x27;#172033&#x27;,size=17){x.fillStyle=color;x.font=`${size}px Arial`;x.fillText(s,a,b)}
function arrow(x,a,b,c,d,color=&#x27;#155eef&#x27;,width=4){line(x,a,b,c,d,color,width);let ang=Math.atan2(d-b,c-a),L=12;x.beginPath();x.moveTo(c,d);x.lineTo(c-L*Math.cos(ang-.5),d-L*Math.sin(ang-.5));x.lineTo(c-L*Math.cos(ang+.5),d-L*Math.sin(ang+.5));x.closePath();x.fillStyle=color;x.fill()}
let pos1=0,paused2=false,t2pos=0,dropT=0,dropOn=false;
function draw1(){let {x,w,h}=ctx(&#x27;c1&#x27;),F=+$(&#x27;f1&#x27;).value,m=+$(&#x27;m1&#x27;).value,a=F/m; $(&#x27;of1&#x27;).textContent=F+&#x27; N&#x27;;$(&#x27;om1&#x27;).textContent=m+&#x27; kg&#x27;;$(&#x27;read1&#x27;).textContent=`Natijaviy kuch: ${F} N; tezlanish: ${a.toFixed(2)} m/s².`;x.clearRect(0,0,w,h);line(x,30,h-35,w-30,h-35,&#x27;#94a3b8&#x27;,3);let bx=100+(pos1%(w-230));x.fillStyle=&#x27;#f59e0b&#x27;;x.fillRect(bx,h-105,95,55);x.fillStyle=&#x27;#6b4b13&#x27;;x.beginPath();x.arc(bx+22,h-42,12,0,7);x.arc(bx+73,h-42,12,0,7);x.fill();arrow(x,bx+45,h-118,bx+45+Math.max(0,F)*2,h-118,&#x27;#155eef&#x27;,4);text(x,&#x27;F = &#x27;+F+&#x27; N&#x27;,bx+30,h-130,&#x27;#155eef&#x27;,15);text(x,&#x27;m = &#x27;+m+&#x27; kg&#x27;,20,30);text(x,&#x27;a = &#x27;+a.toFixed(2)+&#x27; m/s²&#x27;,20,55);pos1+=Math.max(0.4,a*1.5)}
function drawThird(){let {x,w,h}=ctx(&#x27;third&#x27;);x.clearRect(0,0,w,h);x.fillStyle=&#x27;#9dd6ff&#x27;;x.fillRect(100,80,170,75);x.fillStyle=&#x27;#fbbf24&#x27;;x.fillRect(w-270,80,170,75);text(x,&#x27;1-jism&#x27;,150,125);text(x,&#x27;2-jism&#x27;,w-220,125);arrow(x,270,115,380,115,&#x27;#155eef&#x27;,5);arrow(x,w-270,145,w-380,145,&#x27;#e05b48&#x27;,5);text(x,&#x27;Ta’sir&#x27;,310,95,&#x27;#155eef&#x27;,15);text(x,&#x27;Aks ta’sir&#x27;,w-380,175,&#x27;#e05b48&#x27;,15)}
function draw2(){let {x,w,h}=ctx(&#x27;c2&#x27;),tv=+$(&#x27;trainV&#x27;).value,pv=+$(&#x27;personV&#x27;).value;x.clearRect(0,0,w,h);x.fillStyle=&#x27;#e5eef9&#x27;;x.fillRect(70,90,w-140,115);x.fillStyle=&#x27;#8bb8df&#x27;;x.fillRect(90,110,w-180,70);for(let i=0;i&lt;5;i++){x.fillStyle=&#x27;#fff&#x27;;x.fillRect(110+i*125,120,80,40)}line(x,50,225,w-50,225,&#x27;#66768b&#x27;,4);let px=170+(t2pos%(w-330));x.fillStyle=&#x27;#d64f45&#x27;;x.beginPath();x.arc(px,130,13,0,7);x.fill();line(x,px,143,px,170,&#x27;#d64f45&#x27;,4);line(x,px,150,px+18,160,&#x27;#d64f45&#x27;,3);text(x,&#x27;Poyezd&#x27;,90,75);text(x,&#x27;Yo‘lovchi&#x27;,px-35,100,&#x27;#b8322a&#x27;,14);text(x,&#x27;Yerga nisbatan v = &#x27;+(tv+pv).toFixed(1)+&#x27; m/s&#x27;,90,265,&#x27;#155eef&#x27;,18);$(&#x27;otrainV&#x27;).textContent=tv+&#x27; m/s&#x27;;$(&#x27;opersonV&#x27;).textContent=pv+&#x27; m/s&#x27;;$(&#x27;read2&#x27;).textContent=`Yo‘lovchining yerga nisbatan tezligi: ${tv} + (${pv}) = ${(tv+pv).toFixed(1)} m/s.`;if(!paused2)t2pos+=Math.max(.5,tv*.25)}
function draw3(){let {x,w,h}=ctx(&#x27;c3&#x27;),H=+$(&#x27;height3&#x27;).value,g=+$(&#x27;g3&#x27;).value;x.clearRect(0,0,w,h);line(x,35,245,w-35,245,&#x27;#63758b&#x27;,4);let scale=1.9,fall=dropOn?Math.min(H,0.5*g*dropT*dropT):0,y=45+fall*scale;x.fillStyle=&#x27;#e59b31&#x27;;x.beginPath();x.arc(160,Math.min(y,235),15,0,7);x.fill();text(x,&#x27;h₀ = &#x27;+H+&#x27; m&#x27;,35,30);text(x,&#x27;g = &#x27;+g.toFixed(1)+&#x27; m/s²&#x27;,35,55);let t=Math.sqrt(2*H/g);$(&#x27;oheight3&#x27;).textContent=H+&#x27; m&#x27;;$(&#x27;og3&#x27;).textContent=g.toFixed(1)+&#x27; m/s²&#x27;;$(&#x27;read3&#x27;).textContent=dropOn?`t = ${dropT.toFixed(2)} s; v = ${(g*dropT).toFixed(2)} m/s; taxminiy tushish vaqti ${t.toFixed(2)} s.`:`Taxminiy tushish vaqti: ${t.toFixed(2)} s (v₀ = 0).`}
function draw4(){let {x,w,h}=ctx(&#x27;c4&#x27;),m=+$(&#x27;mass4&#x27;).value,a=+$(&#x27;acc4&#x27;).value,g=9.8,N=m*(g+a);x.clearRect(0,0,w,h);x.strokeStyle=&#x27;#77879b&#x27;;x.lineWidth=5;x.strokeRect(w/2-95,35,190,220);x.fillStyle=&#x27;#d9e7f7&#x27;;x.fillRect(w/2-80,50,160,190);x.fillStyle=&#x27;#4b91d1&#x27;;x.beginPath();x.arc(w/2,100,20,0,7);x.fill();x.fillRect(w/2-13,120,26,52);line(x,w/2-10,175,w/2-35,200,&#x27;#4b91d1&#x27;,6);line(x,w/2+10,175,w/2+35,200,&#x27;#4b91d1&#x27;,6);x.fillStyle=&#x27;#f5c65c&#x27;;x.fillRect(w/2-45,215,90,12);arrow(x,w/2+120,210,w/2+120-(a*7),210,&#x27;#e05b48&#x27;,4);text(x,&#x27;Lift&#x27;,w/2-20,25);$(&#x27;omass4&#x27;).textContent=m+&#x27; kg&#x27;;$(&#x27;oacc4&#x27;).textContent=a+&#x27; m/s²&#x27;;$(&#x27;read4&#x27;).textContent=`Tarozi ko‘rsatkichi N = m(g + a) = ${m} × (9.8 + (${a})) = ${N.toFixed(1)} N. ${N&lt;0?&#x27;Bu holatda tanlangan tezlanish fizik model chegarasidan tashqarida.&#x27;:&#x27;&#x27;}`}
function draw5(){let {x,w,h}=ctx(&#x27;c5&#x27;),F1=+$(&#x27;f51&#x27;).value,F2=+$(&#x27;f52&#x27;).value,m=+$(&#x27;m5&#x27;).value,Fn=F1-F2,a=Fn/m;x.clearRect(0,0,w,h);line(x,30,235,w-30,235,&#x27;#8998aa&#x27;,3);let bx=w/2-50;x.fillStyle=&#x27;#8cc6f2&#x27;;x.fillRect(bx,130,100,70);text(x,&#x27;m = &#x27;+m+&#x27; kg&#x27;,bx+15,170);arrow(x,bx+50,115,bx+50+F1*4,115,&#x27;#155eef&#x27;,4);arrow(x,bx+50,215,bx+50-F2*4,215,&#x27;#e05b48&#x27;,4);text(x,&#x27;F₁ = &#x27;+F1+&#x27; N&#x27;,25,55,&#x27;#155eef&#x27;);text(x,&#x27;F₂ = &#x27;+F2+&#x27; N&#x27;,25,80,&#x27;#e05b48&#x27;);$(&#x27;of51&#x27;).textContent=F1+&#x27; N&#x27;;$(&#x27;of52&#x27;).textContent=F2+&#x27; N&#x27;;$(&#x27;om5&#x27;).textContent=m+&#x27; kg&#x27;;$(&#x27;read5&#x27;).textContent=`F_nat = ${F1} − ${F2} = ${Fn} N; a = F_nat/m = ${a.toFixed(2)} m/s² (${Fn&gt;0?&#x27;o‘ngga&#x27;:Fn&lt;0?&#x27;chapga&#x27;:&#x27;tezlanish yo‘q&#x27;}).`}
function loop(){draw1();drawThird();draw2();draw3();draw4();draw5();if(dropOn){dropT+=.025;if(dropT&gt;Math.sqrt(2*(+$(&#x27;height3&#x27;).value)/(+$(&#x27;g3&#x27;).value)))dropOn=false}requestAnimationFrame(loop)}
[&#x27;f1&#x27;,&#x27;m1&#x27;,&#x27;trainV&#x27;,&#x27;personV&#x27;,&#x27;height3&#x27;,&#x27;g3&#x27;,&#x27;mass4&#x27;,&#x27;acc4&#x27;,&#x27;f51&#x27;,&#x27;f52&#x27;,&#x27;m5&#x27;].forEach(id=&gt;$(id).addEventListener(&#x27;input&#x27;,()=&gt;{}));
$(&#x27;reset1&#x27;).onclick=()=&gt;pos1=0;$(&#x27;toggle2&#x27;).onclick=()=&gt;{paused2=!paused2;$(&#x27;toggle2&#x27;).textContent=paused2?&#x27;Davom ettirish&#x27;:&#x27;Pauza&#x27;};
$(&#x27;drop3&#x27;).onclick=()=&gt;{dropT=0;dropOn=true};
loop();
&lt;/script&gt;

&lt;h1&gt;III bob. Mexanikada saqlanish qonunlari&lt;/h1&gt;
&lt;p&gt;Parametrlarni o‘zgartiring va simulyatsiyalarni ishga tushiring. Har bir bo‘limda harakat animatsiyasi ham mavjud.&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h2&gt;14-mavzu. Energiya va ish — qiya tekislikdagi harakat&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Reja:&lt;/b&gt; 1) Mexanik ish. 2) Kinetik va potensial energiya. 3) Mexanik energiyaning saqlanishi va ishqalanish.&lt;/p&gt;
&lt;label&gt;Jism massasi: &lt;span id=&quot;mv&quot;&gt;2&lt;/span&gt; kg&lt;/label&gt;&lt;input id=&quot;m&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;2&quot;&gt;
&lt;label&gt;Balandlik: &lt;span id=&quot;hv&quot;&gt;3&lt;/span&gt; m&lt;/label&gt;&lt;input id=&quot;h&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;3&quot;&gt;
&lt;label&gt;Ishqalanish ulushi: &lt;span id=&quot;fv&quot;&gt;10&lt;/span&gt;%&lt;/label&gt;&lt;input id=&quot;f&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;80&quot; value=&quot;10&quot;&gt;
&lt;canvas id=&quot;ramp&quot; width=&quot;720&quot; height=&quot;260&quot;&gt;&lt;/canvas&gt;&lt;button id=&quot;play&quot;&gt;▶ Animatsiyani boshlash&lt;/button&gt;&lt;button id=&quot;reset&quot;&gt;↺ Qayta boshlash&lt;/button&gt;
&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;Potensial energiya: &lt;b id=&quot;pe&quot;&gt;58.9 J&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Kinetik energiya: &lt;b id=&quot;ke&quot;&gt;0 J&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Ishqalanishga ketgan energiya: &lt;b id=&quot;loss&quot;&gt;0 J&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Jami energiya: &lt;b id=&quot;tot&quot;&gt;58.9 J&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h2&gt;15-mavzu. Qiya tekislikda foydali ish koeffitsiyenti&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Reja:&lt;/b&gt; 1) Foydali va umumiy ish. 2) Qiya tekislikning ishlash prinsipi. 3) FIKni hisoblash.&lt;/p&gt;
&lt;label&gt;Yuk massasi: &lt;span id=&quot;lmv&quot;&gt;5&lt;/span&gt; kg&lt;/label&gt;&lt;input id=&quot;lm&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;
&lt;label&gt;Qiya tekislik uzunligi: &lt;span id=&quot;sv&quot;&gt;4&lt;/span&gt; m&lt;/label&gt;&lt;input id=&quot;s&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;
&lt;label&gt;Ko‘tarilish balandligi: &lt;span id=&quot;hhv&quot;&gt;1.5&lt;/span&gt; m&lt;/label&gt;&lt;input id=&quot;hh&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;90&quot; value=&quot;15&quot;&gt;
&lt;label&gt;Tortish kuchi: &lt;span id=&quot;Fv&quot;&gt;30&lt;/span&gt; N&lt;/label&gt;&lt;input id=&quot;F&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;150&quot; value=&quot;30&quot;&gt;
&lt;canvas id=&quot;lab&quot; width=&quot;720&quot; height=&quot;220&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;Foydali ish: &lt;b id=&quot;useful&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Umumiy ish: &lt;b id=&quot;work&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;FIK: &lt;b id=&quot;eta&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;note&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h2&gt;16-mavzu. Elastik va noelastik to‘qnashish&lt;/h2&gt;
&lt;p&gt;&lt;b&gt;Reja:&lt;/b&gt; 1) Impuls va uning saqlanishi. 2) Elastik to‘qnashish. 3) Noelastik to‘qnashish.&lt;/p&gt;
&lt;label&gt;1-jism massasi: &lt;span id=&quot;m1v&quot;&gt;2&lt;/span&gt; kg&lt;/label&gt;&lt;input id=&quot;m1&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;8&quot; value=&quot;2&quot;&gt;
&lt;label&gt;1-jism tezligi: &lt;span id=&quot;v1v&quot;&gt;3&lt;/span&gt; m/s&lt;/label&gt;&lt;input id=&quot;v1&quot; type=&quot;range&quot; min=&quot;-5&quot; max=&quot;8&quot; value=&quot;3&quot;&gt;
&lt;label&gt;2-jism massasi: &lt;span id=&quot;m2v&quot;&gt;2&lt;/span&gt; kg&lt;/label&gt;&lt;input id=&quot;m2&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;8&quot; value=&quot;2&quot;&gt;
&lt;label&gt;2-jism tezligi: &lt;span id=&quot;v2v&quot;&gt;0&lt;/span&gt; m/s&lt;/label&gt;&lt;input id=&quot;v2&quot; type=&quot;range&quot; min=&quot;-5&quot; max=&quot;8&quot; value=&quot;0&quot;&gt;
&lt;label&gt;To‘qnashish turi&lt;/label&gt;&lt;select id=&quot;type&quot;&gt;&lt;option value=&quot;elastic&quot;&gt;Absolyut elastik&lt;/option&gt;&lt;option value=&quot;inelastic&quot;&gt;Absolyut noelastik (birga harakatlanadi)&lt;/option&gt;&lt;/select&gt;
&lt;canvas id=&quot;coll&quot; width=&quot;720&quot; height=&quot;210&quot;&gt;&lt;/canvas&gt;&lt;button id=&quot;cplay&quot;&gt;▶ To‘qnashuv animatsiyasi&lt;/button&gt;&lt;button id=&quot;creset&quot;&gt;↺ Qayta boshlash&lt;/button&gt;
&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;Impuls oldin: &lt;b id=&quot;pb&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Impuls keyin: &lt;b id=&quot;pa&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Kinetik energiya oldin: &lt;b id=&quot;kb&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;Kinetik energiya keyin: &lt;b id=&quot;ka&quot;&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;cnote&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;script&gt;
const $=id=&gt;document.getElementById(id), n=id=&gt;Number($(id).value), fmt=x=&gt;(Math.abs(x)&lt;.005?0:x).toFixed(2);
let rt=0,rr=false,ct=0,cr=false;
function ramp(){
 let m=n(&#x27;m&#x27;),h=n(&#x27;h&#x27;),f=n(&#x27;f&#x27;)/100; $(&#x27;mv&#x27;).textContent=m;$(&#x27;hv&#x27;).textContent=h;$(&#x27;fv&#x27;).textContent=n(&#x27;f&#x27;);
 let t=rt,E=m*9.81*h,pe=E*(1-t),loss=E*f*t,ke=Math.max(0,E-pe-loss);
 $(&#x27;pe&#x27;).textContent=fmt(pe)+&#x27; J&#x27;;$(&#x27;ke&#x27;).textContent=fmt(ke)+&#x27; J&#x27;;$(&#x27;loss&#x27;).textContent=fmt(loss)+&#x27; J&#x27;;$(&#x27;tot&#x27;).textContent=fmt(pe+ke+loss)+&#x27; J&#x27;;
 let c=$(&#x27;ramp&#x27;),x=c.getContext(&#x27;2d&#x27;);x.clearRect(0,0,720,260);x.strokeStyle=&#x27;#657789&#x27;;x.lineWidth=6;x.beginPath();x.moveTo(85,40);x.lineTo(610,220);x.lineTo(670,220);x.stroke();x.fillStyle=&#x27;#0d9488&#x27;;x.save();x.translate(85+525*t,40+180*t-12);x.rotate(Math.atan2(180,525));x.fillRect(-15,-13,30,26);x.restore();x.fillStyle=&#x27;#172033&#x27;;x.font=&#x27;18px Arial&#x27;;x.fillText(&#x27;h = &#x27;+h+&#x27; m&#x27;,18,28);x.fillText(&#x27;Qiya tekislik&#x27;,330,115);
}
function rampLoop(){if(rr){rt=Math.min(1,rt+.006);ramp();if(rt&gt;=1)rr=false}requestAnimationFrame(rampLoop)}
[&#x27;m&#x27;,&#x27;h&#x27;,&#x27;f&#x27;].forEach(id=&gt;$(id).oninput=()=&gt;{rt=0;ramp()});$(&#x27;play&#x27;).onclick=()=&gt;{rt=0;rr=true};$(&#x27;reset&#x27;).onclick=()=&gt;{rr=false;rt=0;ramp()};
function lab(){let m=n(&#x27;lm&#x27;),s=n(&#x27;s&#x27;),h=n(&#x27;hh&#x27;)/10,F=n(&#x27;F&#x27;);$(&#x27;lmv&#x27;).textContent=m;$(&#x27;sv&#x27;).textContent=s;$(&#x27;hhv&#x27;).textContent=h.toFixed(1);$(&#x27;Fv&#x27;).textContent=F;let u=m*9.81*h,w=F*s,e=u/w*100;$(&#x27;useful&#x27;).textContent=fmt(u)+&#x27; J&#x27;;$(&#x27;work&#x27;).textContent=fmt(w)+&#x27; J&#x27;;$(&#x27;eta&#x27;).textContent=fmt(e)+&#x27;%&#x27;;$(&#x27;note&#x27;).textContent=e&gt;100?&#x27;FIK 100% dan oshmasligi kerak: berilgan qiymatlarni qayta tekshiring.&#x27;:&#x27;FIK foydali ishning umumiy ishga nisbatidir.&#x27;;let c=$(&#x27;lab&#x27;),x=c.getContext(&#x27;2d&#x27;);x.clearRect(0,0,720,220);x.strokeStyle=&#x27;#657789&#x27;;x.lineWidth=6;x.beginPath();x.moveTo(100,35);x.lineTo(570,190);x.lineTo(640,190);x.stroke();x.fillStyle=&#x27;#0d9488&#x27;;x.fillRect(100,24,28,24);x.fillStyle=&#x27;#172033&#x27;;x.font=&#x27;17px Arial&#x27;;x.fillText(&#x27;Yuk&#x27;,100,18);x.fillText(&#x27;h = &#x27;+h.toFixed(1)+&#x27; m&#x27;,18,65);x.fillText(&#x27;s = &#x27;+s+&#x27; m&#x27;,400,145)}
[&#x27;lm&#x27;,&#x27;s&#x27;,&#x27;hh&#x27;,&#x27;F&#x27;].forEach(id=&gt;$(id).oninput=lab);
function calc(){let m1=n(&#x27;m1&#x27;),m2=n(&#x27;m2&#x27;),v1=n(&#x27;v1&#x27;),v2=n(&#x27;v2&#x27;),elastic=$(&#x27;type&#x27;).value===&#x27;elastic&#x27;,u1,u2;if(elastic){u1=((m1-m2)*v1+2*m2*v2)/(m1+m2);u2=((m2-m1)*v2+2*m1*v1)/(m1+m2)}else u1=u2=(m1*v1+m2*v2)/(m1+m2);let p=m1*v1+m2*v2,k=.5*m1*v1*v1+.5*m2*v2*v2,k2=.5*m1*u1*u1+.5*m2*u2*u2;$(&#x27;m1v&#x27;).textContent=m1;$(&#x27;m2v&#x27;).textContent=m2;$(&#x27;v1v&#x27;).textContent=v1;$(&#x27;v2v&#x27;).textContent=v2;$(&#x27;pb&#x27;).textContent=fmt(p)+&#x27; kg·m/s&#x27;;$(&#x27;pa&#x27;).textContent=fmt(m1*u1+m2*u2)+&#x27; kg·m/s&#x27;;$(&#x27;kb&#x27;).textContent=fmt(k)+&#x27; J&#x27;;$(&#x27;ka&#x27;).textContent=fmt(k2)+&#x27; J&#x27;;$(&#x27;cnote&#x27;).textContent=elastic?&#x27;Elastik to‘qnashuvda impuls va kinetik energiya saqlanadi. Yakuniy tezliklar: &#x27;+fmt(u1)+&#x27; va &#x27;+fmt(u2)+&#x27; m/s.&#x27;:&#x27;Noelastik to‘qnashuvda jismlar birga harakatlanadi. Umumiy tezlik: &#x27;+fmt(u1)+&#x27; m/s; kinetik energiya kamayishi: &#x27;+fmt(k-k2)+&#x27; J.&#x27;;return {m1,m2,v1,v2,u1,u2}}
function drawColl(){let d=calc(),c=$(&#x27;coll&#x27;),x=c.getContext(&#x27;2d&#x27;);x.clearRect(0,0,720,210);x.strokeStyle=&#x27;#657789&#x27;;x.lineWidth=2;x.beginPath();x.moveTo(15,150);x.lineTo(705,150);x.stroke();let a=100+200*ct,b=610-200*ct;if(ct&gt;.5){let q=(ct-.5)*2;a=300+Math.sign(d.u1||1)*90*q;b=$(&#x27;type&#x27;).value===&#x27;inelastic&#x27;?a:360+Math.sign(d.u2||1)*90*q}function ball(px,label){x.beginPath();x.arc(px,110,25,0,Math.PI*2);x.fillStyle=&#x27;#0d9488&#x27;;x.fill();x.fillStyle=&#x27;white&#x27;;x.font=&#x27;bold 17px Arial&#x27;;x.textAlign=&#x27;center&#x27;;x.fillText(label,px,116)}ball(a,&#x27;1&#x27;);ball(b,&#x27;2&#x27;);x.fillStyle=&#x27;#172033&#x27;;x.textAlign=&#x27;left&#x27;;x.font=&#x27;16px Arial&#x27;;x.fillText(&#x27;Boshlang‘ich tezliklar: &#x27;+d.v1+&#x27; m/s va &#x27;+d.v2+&#x27; m/s&#x27;,15,28)}
function collLoop(){if(cr){ct=Math.min(1,ct+.009);drawColl();if(ct&gt;=1)cr=false}requestAnimationFrame(collLoop)}
[&#x27;m1&#x27;,&#x27;m2&#x27;,&#x27;v1&#x27;,&#x27;v2&#x27;,&#x27;type&#x27;].forEach(id=&gt;$(id).oninput=drawColl);$(&#x27;cplay&#x27;).onclick=()=&gt;{ct=0;cr=true};$(&#x27;creset&#x27;).onclick=()=&gt;{cr=false;ct=0;drawColl()};
ramp();lab();drawColl();rampLoop();collLoop();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" hidden></iframe>

div class=&quot;prompt&quot;&gt;10-sinf fizika fanidan “Jismlarning muvozanatda bo‘lish shartlari” mavzusini tushuntir. Kuchlar va kuch momenti uchun formulalarni yoz, kundalik hayotdan misollar keltir, 3 bandli reja asosida interaktiv simulyatsiya va taxta og‘ishini ko‘rsatuvchi animatsiya g‘oyasini ishlab chiq. Laboratoriya mashg‘ulotini qo‘shma.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;t18&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;18-mavzu&lt;/span&gt;&lt;h2&gt;Momentlar qoidasiga asoslanib ishlaydigan mexanizmlar&lt;/h2&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Kuch momenti va momentlar qoidasining mazmuni.&lt;/li&gt;&lt;li&gt;Richag, qaychi, ombur va boshqa mexanizmlarning ishlashi.&lt;/li&gt;&lt;li&gt;Kuch yelkasi o‘zgarishining natijaga ta’siri.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;formula&quot;&gt;M = F · l; muvozanatda F₁l₁ = F₂l₂&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya va animatsiya: richag&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Kuch va yelkani o‘zgartirib, richagning muvozanatga kelishini kuzating.&lt;/p&gt;&lt;canvas id=&quot;c18&quot; width=&quot;900&quot; height=&quot;290&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Chap kuch F₁: &lt;input id=&quot;f18a&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;40&quot;&gt;&lt;output id=&quot;of18a&quot;&gt;40&lt;/output&gt; N&lt;/label&gt;&lt;label&gt;Chap yelka l₁: &lt;input id=&quot;l18a&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;ol18a&quot;&gt;3&lt;/output&gt;&lt;/label&gt;&lt;label&gt;O‘ng kuch F₂: &lt;input id=&quot;f18b&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;60&quot;&gt;&lt;output id=&quot;of18b&quot;&gt;60&lt;/output&gt; N&lt;/label&gt;&lt;label&gt;O‘ng yelka l₂: &lt;input id=&quot;l18b&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;ol18b&quot;&gt;2&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;r18&quot; class=&quot;formula&quot;&gt;&lt;/p&gt;&lt;button onclick=&quot;toggleAnim(18,this)&quot;&gt;Animatsiyani to‘xtatish&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&g &lt;section id=&quot;t19&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;19-mavzu&lt;/span&gt;&lt;h2&gt;Aylanma harakat dinamikasi&lt;/h2&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Aylanma harakatni tavsiflovchi kattaliklar: burchak tezlik va burchak tezlanish.&lt;/li&gt;&lt;li&gt;Kuch momenti va inertsiya momentining roli.&lt;/li&gt;&lt;li&gt;Aylanma harakat qonunlarining texnikadagi misollari.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;formula&quot;&gt;ω = Δφ/Δt;  M = Iα&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya va animatsiya: aylanuvchi disk&lt;/h3&gt;&lt;canvas id=&quot;c19&quot; width=&quot;900&quot; height=&quot;290&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Burchak tezlik ω: &lt;input id=&quot;w19&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;ow19&quot;&gt;4&lt;/output&gt; shartli birlik&lt;/label&gt;&lt;label&gt;Inertsiya momenti I: &lt;input id=&quot;i19&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;5&quot;&gt;&lt;output id=&quot;oi19&quot;&gt;5&lt;/output&gt;&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;r19&quot; class=&quot;formula&quot;&gt;&lt;/p&gt;&lt;button onclick=&quot;toggleAnim(19,this)&quot;&gt;Animatsiyani to‘xtatish&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;ChatGPT uchun prompt&lt;/h3&gt;&lt;div class=&quot;prompt&quot;&gt;10-sinf uchun “Aylanma harakat dinamikasi” mavzusini 3 bandli reja asosida yorit. Burchak tezlik, burchak tezlanish, kuch momenti va inertsiya momentini formulalar bilan izohla. Aylanuvchi diskning tezligini boshqarish mumkin bo‘lgan animatsion simulyatsiya yarat, velosiped g‘ildiragi va ventilyator misollarini keltir. Laboratoriya mashg‘uloti bo‘lmasin.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;t20&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;20-mavzu&lt;/span&gt;&lt;h2&gt;Suyuqlik va gazlar harakati, oqimning uzluksizlik teoremasi. Bernulli tenglamasi&lt;/h2&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Suyuqlik va gaz oqimi, oqim chiziqlari tushunchasi.&lt;/li&gt;&lt;li&gt;Oqimning uzluksizlik teoremasi va kesim yuzasi.&lt;/li&gt;&lt;li&gt;Bernulli tenglamasi: bosim, tezlik va balandlik orasidagi bog‘lanish.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;formula&quot;&gt;A₁v₁ = A₂v₂;  p + ½ρv² + ρgh = const&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya va animatsiya: torayuvchi quvur&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Quvurning tor qismida oqim tezligi qanday o‘zgarishini kuzating.&lt;/p&gt;&lt;canvas id=&quot;c20&quot; width=&quot;900&quot; height=&quot;290&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Keng qism yuzi A₁: &lt;input id=&quot;a20&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;10&quot; value=&quot;8&quot;&gt;&lt;output id=&quot;oa20&quot;&gt;8&lt;/output&gt;&lt;/label&gt;&lt;label&gt;Tor qism yuzi A₂: &lt;input id=&quot;b20&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;ob20&quot;&gt;3&lt;/output&gt;&lt;/label&gt;&lt;label&gt;Kirish tezligi v₁: &lt;input id=&quot;v20&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;ov20&quot;&gt;2&lt;/output&gt; m/s&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;r20&quot; class=&quot;formula&quot;&gt;&lt;/p&gt;&lt;button onclick=&quot;toggleAnim(20,this)&quot;&gt;Animatsiyani to‘xtatish&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;ChatGPT uchun prompt&lt;/h3&gt;&lt;div class=&quot;prompt&quot;&gt;“Suyuqlik va gazlar harakati, oqimning uzluksizlik teoremasi va Bernulli tenglamasi” mavzusini 10-sinf darajasida 3 bandli re &lt;section id=&quot;t21&quot; class=&quot;panel&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;pill&quot;&gt;21-mavzu&lt;/span&gt;&lt;h2&gt;Harakatlanayotgan gazlar va suyuqliklarda bosimning tezlikka bog‘liqligidan texnikada foydalanish&lt;/h2&gt;&lt;h3&gt;Reja&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Oqim tezligi va bosim orasidagi bog‘lanish.&lt;/li&gt;&lt;li&gt;Samolyot qanoti, purkagich va mo‘ri tortishi misollari.&lt;/li&gt;&lt;li&gt;Bernulli prinsipining texnika va kundalik hayotdagi qo‘llanilishi.&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;formula&quot;&gt;Oqim tezligi ortganda statik bosim kamayishi mumkin (sharoitga bog‘liq).&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Simulyatsiya va animatsiya: oqim tezligi va bosim&lt;/h3&gt;&lt;canvas id=&quot;c21&quot; width=&quot;900&quot; height=&quot;290&quot;&gt;&lt;/canvas&gt;&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Oqim tezligi: &lt;input id=&quot;v21&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;ov21&quot;&gt;4&lt;/output&gt; m/s&lt;/label&gt;&lt;/div&gt;&lt;p id=&quot;r21&quot; class=&quot;formula&quot;&gt;&lt;/p&gt;&lt;button onclick=&quot;toggleAnim(21,this)&quot;&gt;Animatsiyani to‘xtatish&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;ChatGPT uchun prompt&lt;/h3&gt;&lt;div class=&quot;prompt&quot;&gt;10-sinf fizika fanidan “Harakatlanayotgan gazlar va suyuqliklarda bosimning tezlikka bog‘liqligidan texnikada foydalanish” mavzusini 3 bandli reja bilan tayyorla. Bernulli prinsipini, samolyot qanoti, purkagich va mo‘ri misollarini sodda tushuntir. Oqim tezligi o‘zgarganda bosim ko‘rsatkichlari yangilanadigan interaktiv simulyatsiya va animatsiya ishlab chiq. Laboratoriya mashg‘uloti kiritilmasin.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

function setup(c){let x=$(c),g=x.getContext(&#x27;2d&#x27;);return {x,g,w:x.width,h:x.height}}function clear(g,w,h){g.clearRect(0,0,w,h)}function line(g,x1,y1,x2,y2,color=&#x27;#50627a&#x27;,width=3){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function txt(g,s,x,y,color=&#x27;#172033&#x27;,size=17){g.fillStyle=color;g.font=size+&#x27;px Arial&#x27;;g.fillText(s,x,y)}function arrow(g,x1,y1,x2,y2,color=&#x27;#175cd3&#x27;){line(g,x1,y1,x2,y2,color,3);let a=Math.atan2(y2-y1,x2-x1),l=10;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-l*Math.cos(a-.5),y2-l*Math.sin(a-.5));g.lineTo(x2-l*Math.cos(a+.5),y2-l*Math.sin(a+.5));g.closePath();g.fillStyle=color;g.fill()}
function draw17(){let {g,w,h}=setup(&#x27;c17&#x27;);clear(g,w,h);let ma=+$(&#x27;m17a&#x27;).value,da=+$(&#x27;d17a&#x27;).value,mb=+$(&#x27;m17b&#x27;).value,db=+$(&#x27;d17b&#x27;).value;[&#x27;m17a&#x27;,&#x27;d17a&#x27;,&#x27;m17b&#x27;,&#x27;d17b&#x27;].forEach((id,i)=&gt;$([&#x27;o17a&#x27;,&#x27;o17d&#x27;,&#x27;o17b&#x27;,&#x27;o17e&#x27;][i]).textContent=$(id).value);let L=ma*da,R=mb*db,tilt=Math.max(-.25,Math.min(.25,(R-L)/100));line(g,140,145+tilt*130,760,145-tilt*130,&#x27;#8a6b45&#x27;,12);g.fillStyle=&#x27;#5a6575&#x27;;g.beginPath();g.moveTo(450,165);g.lineTo(410,225);g.lineTo(490,225);g.closePath();g.fill();g.fillStyle=&#x27;#f59e0b&#x27;;g.fillRect(450-da*55-22,105,44,40);g.fillStyle=&#x27;#2e90fa&#x27;;g.fillRect(450+db*55-22,105,44,40);txt(g,ma+&#x27; kg&#x27;,450-da*55-17,96);txt(g,mb+&#x27; kg&#x27;,450+db*55-17,96);arrow(g,450-da*55,150,450-da*55,190,&#x27;#d92d20&#x27;);arrow(g,450+db*55,150,450+db*55,190,&#x27;#175cd3&#x27;);txt(g,&#x27;Tayanch&#x27;,410,248,&#x27;#5b667a&#x27;);$(&#x27;r17&#x27;).textContent=`Chap moment = ${L} shartli birlik; o‘ng moment = ${R}. `+(Math.abs(L-R)&lt;0.01?&#x27;Taxta muvozanatda.&#x27;:L&gt;R?&#x27;Chap tomondagi moment katta — chap tomon pastga intiladi.&#x27;:&#x27;O‘ng tomondagi moment katta — o‘ng tomon pastga intiladi.&#x27;);}
function draw18(){let {g,w,h}=setup(&#x27;c18&#x27;);clear(g,w,h);let f1=+$(&#x27;f18a&#x27;).value,l1=+$(&#x27;l18a&#x27;).value,f2=+$(&#x27;f18b&#x27;).value,l2=+$(&#x27;l18b&#x27;).value;[&#x27;f18a&#x27;,&#x27;l18a&#x27;,&#x27;f18b&#x27;,&#x27;l18b&#x27;].forEach((id,i)=&gt;$([&#x27;of18a&#x27;,&#x27;ol18a&#x27;,&#x27;of18b&#x27;,&#x27;ol18b&#x27;][i]).textContent=$(id).value);line(g,150,145,750,145,&#x27;#8a6b45&#x27;,12);g.fillStyle=&#x27;#64748b&#x27;;g.beginPath();g.moveTo(450,160);g.lineTo(410,230);g.lineTo(490,230);g.closePath();g.fill();arrow(g,450-l1*55,75,450-l1*55,125,&#x27;#d92d20&#x27;);arrow(g,450+l2*55,75,450+l2*55,125,&#x27;#175cd3&#x27;);txt(g,&#x27;F₁=&#x27;+f1+&#x27; N&#x27;,450-l1*55-35,65);txt(g,&#x27;F₂=&#x27;+f2+&#x27; N&#x27;,450+l2*55-35,65);let M1=f1*l1,M2=f2*l2;$(&#x27;r18&#x27;).textContent=`Chap moment M₁ = ${M1} N·birlik; o‘ng moment M₂ = ${M2} N·birlik. `+(M1===M2?&#x27;Richag muvozanatda.&#x27;:M1&gt;M2?&#x27;Chap moment kattaroq.&#x27;:&#x27;O‘ng moment kattaroq.&#x27;);}
function draw19(){let {g,w,h}=setup(&#x27;c19&#x27;);clear(g,w,h);let om=+$(&#x27;w19&#x27;).value,I=+$(&#x27;i19&#x27;).value;$(&#x27;ow19&#x27;).textContent=om;$(&#x27;oi19&#x27;).textContent=I;let cx=450,cy=145,r=75;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fillStyle=&#x27;#e8f1ff&#x27;;g.fill();g.strokeStyle=&#x27;#175cd3&#x27;;g.lineWidth=5;g.stroke();for(let k=0;k&lt;8;k++){let a=phase*om*.03+k*Math.PI/4;line(g,cx,cy,cx+Math.cos(a)*r,cy+Math.sin(a)*r,&#x27;#175cd3&#x27;,3)}g.beginPath();g.arc(cx,cy,8,0,Math.PI*2);g.fillStyle=&#x27;#d92d20&#x27;;g.fill();txt(g,&#x27;ω = &#x27;+om+&#x27; birlik&#x27;,70,55);txt(g,&#x27;I = &#x27;+I,70,82);$(&#x27;r19&#x27;).textContent=`Burchak tezlik ω = ${om} shartli birlik. Bir xil kuch momentida I ortsa, α = M/I bo‘yicha burchak tezlanish kamayadi.`;}
